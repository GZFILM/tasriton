<body>
<style>
/* Layout: one centered column like a school workbook; a 4-step track on top; the finished script sits on a white "page"
   and every character has its own color (א coral, ב teal, ג purple...) so kids can see who talks. */
:root{
  --bg:#EEF0F7; --surface:#FFFFFF; --ink:#1D1B38; --muted:#5E6180; --line:#D6D9E8; --field:#F6F7FB;
  --accent:#FFC23D; --accent-ink:#2A1E00;
  --a:#E8534A; --a-bg:#FDE7E5; --b:#139C8C; --b-bg:#DDF4F0;
  --paper:#FFFFFF; --paper-ink:#1B1A1F; --paper-line:#E4E2EA;
  --display:"Secular One","Rubik","Arial Hebrew",Arial,sans-serif;
  --ui:"Rubik","Arial Hebrew","Segoe UI",Arial,sans-serif;
  --script:"David Libre","David","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#14142A; --surface:#1F1F3B; --ink:#EEEEF8; --muted:#A3A6C4; --line:#33345A; --field:#191932;
  --accent:#FFC23D; --accent-ink:#2A1E00;
  --a:#FF7A70; --a-bg:#3D1F27; --b:#3CCDB9; --b-bg:#173733;
  --paper:#FBFAF7; --paper-ink:#1B1A1F; --paper-line:#E4E2EA; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#14142A; --surface:#1F1F3B; --ink:#EEEEF8; --muted:#A3A6C4; --line:#33345A; --field:#191932;
  --accent:#FFC23D; --accent-ink:#2A1E00;
  --a:#FF7A70; --a-bg:#3D1F27; --b:#3CCDB9; --b-bg:#173733;
  --paper:#FBFAF7; --paper-ink:#1B1A1F; --paper-line:#E4E2EA; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.wrap{max-width:780px;margin:0 auto;padding-block:16px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px}
.clap{width:44px;height:44px;flex:none;border-radius:10px;box-shadow:0 2px 6px rgba(20,20,50,.18)}
.logo h1{font-family:var(--display);font-size:30px;font-weight:400;line-height:1}
.logo small{display:block;font-size:13px;color:var(--muted)}
.top{position:relative}
.menubtn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px;font-weight:500}
.menuveil{position:fixed;inset:0;z-index:30;background:rgba(14,13,24,.25);border:0;padding:0;cursor:default}
.menu{position:absolute;top:calc(100% + 6px);inset-inline-end:0;z-index:31;width:min(320px,calc(100vw - 32px));background:var(--surface);border:1.5px solid var(--line);border-radius:14px;box-shadow:0 16px 40px rgba(20,20,50,.22);padding:6px;display:flex;flex-direction:column}
.menu [role=menuitem]{display:flex;align-items:center;gap:12px;text-align:start;background:none;border:0;border-radius:10px;padding:10px 12px;color:var(--ink);min-height:48px}
.menu [role=menuitem]:hover,.menu [role=menuitem]:focus-visible{background:var(--field)}
.menu [role=menuitem] svg{flex:none;color:var(--muted)}
.menu b{display:block;font-weight:500;font-size:16px}
.menu small{display:block;font-size:12.5px;color:var(--muted)}
.menufoot{border-top:1px solid var(--line);margin-top:4px;padding:8px 12px 4px;font-size:12px;color:var(--muted)}
.newver{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:8px 12px;font-size:15px}
.newver span{flex:1;min-width:140px}
.newver .x{border:0;background:none;font-size:22px;line-height:1;color:var(--muted);padding:2px 6px}
.rel{border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--field)}
.rel.latest{border-color:var(--accent)}
.relhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.relhead span{font-size:13px;color:var(--muted)}
.relhead .tag{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 9px;font-size:12px;font-weight:700}
.rel ul,.plain{margin:8px 0 0;padding-inline-start:20px;display:flex;flex-direction:column;gap:4px}
.panel p{line-height:1.6}
.linkbtn{background:none;border:0;color:var(--muted);font-size:14px;text-decoration:underline;padding:6px}

.track{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;list-style:none;margin:0;padding:0}
.track button{width:100%;border:0;border-radius:10px;padding:8px 6px;background:var(--surface);color:var(--muted);font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line)}
.track b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--field);font-size:12px;flex:none}
.track button[aria-current="step"]{border-color:var(--ink);color:var(--ink);font-weight:500}
.track button[aria-current="step"] b{background:var(--accent);color:var(--accent-ink)}
.track button.done b{background:var(--ink);color:var(--surface)}
.track button:disabled{opacity:.5;cursor:default}
@media (max-width:480px){ .track span{display:none} .track button{padding:8px 0} }

.h2{font-family:var(--display);font-size:26px;font-weight:400;line-height:1.15;text-wrap:balance}
.lead{color:var(--muted);font-size:15px}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.pick{position:relative;text-align:start;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.pick:hover{border-color:var(--muted)}
.pick[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px var(--accent) inset}
.pick h3{font-size:18px;font-weight:700}
.pick p{font-size:14px;color:var(--muted)}
/* Home welcome and the school / crew / filmmaker tiles */
.welcome{align-items:center;text-align:center;padding:22px 16px}
.welcome .clap{width:84px;height:84px}
.kinds{grid-template-columns:repeat(3,1fr);gap:10px}
.pick.kind{align-items:center;text-align:center;padding:18px 8px;gap:8px}
.pick.kind p{font-size:13px;line-height:1.35}
.pick.kind:hover{border-color:var(--accent)}
.kicon{font-size:40px;line-height:1}
.pick.kind h3{font-size:21px}
.genre{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:500;padding:3px 10px 3px 8px;border-radius:999px;background:var(--field);border:1px solid var(--line)}
.from{position:absolute;top:10px;inset-inline-end:10px;font-size:11px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 8px}
.slug{font-family:var(--script);font-size:14px;color:var(--muted);direction:rtl}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:500}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:none}
.btn.small{min-height:38px;padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* characters */
.chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.char{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.c0{--c:var(--a)} .c1{--c:var(--b)} .c2{--c:#7B5CE0} .c3{--c:#E8872A} .c4{--c:#2F7FD8} .c5{--c:#D64C9C}
.char{border-color:var(--c)}
.char h3{font-size:15px;font-weight:500;display:flex;align-items:center;gap:8px}
.char h3 .sp{flex:1}
.char .rm{border:1px solid var(--line);background:var(--surface);border-radius:8px;font-size:13px;padding:3px 10px;color:var(--muted)}
.dot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--c)}
.addchar{border:2px dashed var(--line);background:none;border-radius:14px;padding:14px;color:var(--muted);font-size:16px;min-height:120px}
.addchar:hover{border-color:var(--muted);color:var(--ink)}
.teacher-note{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.teacher-note .slug{font-size:18px;color:var(--ink)}
.char input[type=text]{width:100%;font-size:22px;font-weight:700;padding:8px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--field)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;align-self:flex-start}
.seg button{border:0;background:var(--surface);padding:7px 16px;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:4px 12px;font-size:14px}
.chip:hover{border-color:var(--muted)}

/* script */
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){ .meta{grid-template-columns:1fr} }
.meta label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.meta input{font-size:16px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);width:100%}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.hint{font-size:13.5px;color:var(--muted)}

.page{background:var(--paper);color:var(--paper-ink);border-radius:6px;box-shadow:0 1px 0 var(--paper-line),0 10px 30px rgba(20,20,50,.12);
  padding:34px clamp(16px,6vw,56px) 40px;font-family:var(--script);font-size:18px;line-height:1.55;display:flex;flex-direction:column;gap:2px}
.ptitle{text-align:center;font-weight:700;font-size:26px;margin-bottom:2px}
.pby{text-align:center;font-size:15px;color:#5a5866;margin-bottom:18px}
.slugline{position:relative;display:block;width:100%;text-align:start;background:none;border:0;border-radius:8px;padding:6px 8px;padding-inline-end:58px;font:inherit;color:inherit;font-weight:700;margin:6px 0 10px;letter-spacing:.01em}
.slugline:hover{background:#F3F1F7}
.slugline .pen{position:absolute;top:6px;inset-inline-end:4px;font-family:var(--ui);font-size:11px;font-weight:400;color:#8a8796;border:1px solid #DDDAE5;border-radius:999px;padding:0 7px;background:#fff}
.sceneed{font-family:var(--ui);font-size:15px;background:#FFFBEF;border:1.5px solid #F1D88F;border-radius:10px;padding:10px;margin:-4px 0 10px;display:flex;flex-direction:column;gap:8px;color:#2a2733}
.sceneed input{border:1.5px solid #E7E2D3;border-radius:8px;padding:8px 10px;background:#fff;color:#2a2733;width:100%}
.sceneed .who-pick span{font-size:13px;color:#6b6676;align-self:center;min-width:44px}
.ln{position:relative;display:block;width:100%;text-align:start;background:none;border:0;border-radius:8px;padding:6px 8px;color:inherit;font:inherit}
.ln:hover{background:#F3F1F7}
.ln.open{background:#FFF6DA}
.ln .who{display:block;text-align:center;font-weight:700;letter-spacing:.04em}
.ln .say{display:block;max-width:30em;margin:0 auto;text-align:center}
.ln.c0 .who{color:#C2382F} .ln.c1 .who{color:#0D7D70} .ln.c2 .who{color:#5B3FC4} .ln.c3 .who{color:#B25E0E} .ln.c4 .who{color:#1F62B0} .ln.c5 .who{color:#A8317A}
.ln.act{padding-inline-end:58px}
.ln.act .say{max-width:none;text-align:start}
.ln .pen{position:absolute;top:6px;inset-inline-end:4px;font-family:var(--ui);font-size:11px;color:#8a8796;border:1px solid #DDDAE5;border-radius:999px;padding:0 7px;background:#fff}
.ln.custom .pen{border-color:#E8B33A;color:#7a5a00}
.opts{font-family:var(--ui);font-size:15px;background:#FFFBEF;border:1.5px solid #F1D88F;border-radius:10px;padding:10px;margin:2px 0 8px;display:flex;flex-direction:column;gap:6px;color:#2a2733}
.opt{text-align:start;border:1.5px solid #E7E2D3;background:#fff;border-radius:8px;padding:8px 10px;line-height:1.45}
.opt[aria-pressed="true"]{border-color:#2a2733;box-shadow:0 0 0 2px #FFC23D inset}
.opts textarea{width:100%;min-height:64px;border:1.5px solid #E7E2D3;border-radius:8px;padding:8px 10px;background:#fff;color:#2a2733;resize:vertical}
.opts .row{justify-content:space-between}
.opts .lbl{font-size:13px;color:#6b6676}
.who-pick{display:flex;gap:6px;flex-wrap:wrap}
.who-pick button{border:1.5px solid #E7E2D3;background:#fff;border-radius:999px;padding:4px 12px;font-size:14px;color:#2a2733}
.who-pick button[aria-pressed="true"]{background:#2a2733;color:#fff;border-color:#2a2733}
.add{display:flex;justify-content:center;margin:0}
.add button{font-family:var(--ui);font-size:12px;color:#8a8796;background:none;border:1px dashed #D8D4E2;border-radius:999px;padding:0 10px;line-height:20px;opacity:.75}
.add button:hover{opacity:1;color:#2a2733;border-color:#2a2733}
.fin{text-align:center;font-weight:700;margin-top:18px;letter-spacing:.2em}
.finish{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:var(--surface);border:2px dashed var(--line);border-radius:14px;padding:18px}
.finish.done{border:2px solid var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 25%,transparent)}
.finish h3{font-family:var(--display);font-size:24px;font-weight:400}
.audmeter{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.audmeter span{width:22px;height:22px;border-radius:50%;border:2px solid var(--accent);background:var(--surface)}
.audmeter span.used{background:var(--accent)}
.finish.action{border-color:#E8322F;box-shadow:0 0 0 4px rgba(232,50,47,.18)}
.finish.action .btn.pri{background:#E8322F;border-color:#E8322F;color:#fff}
.btn.big{min-height:56px;padding:12px 28px;font-size:19px}

/* teacher */
.panel{background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h3{font-size:17px}
.field{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.field input,.field textarea,.field select{font-size:15px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--field);color:var(--ink);width:100%}
.field textarea{min-height:92px;resize:vertical;line-height:1.5}
.beat{border:1.5px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--field)}
.beat{border-inline-start:5px solid var(--c,var(--muted))}
.beat.act{--c:var(--muted)}
.btools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btools .lbl{font-size:12.5px;color:var(--muted)}
.btools button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:13px}
.btools button:hover{border-color:var(--ink)}
.gform{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;background:var(--surface);border:1px dashed var(--muted);border-radius:10px;padding:10px}
.gform .field{flex:1 1 110px}
.gform select{width:auto}
.preview{background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:8px 12px;font-family:var(--script);font-size:16px;line-height:1.5;display:flex;flex-direction:column;gap:2px}
.preview b{font-family:var(--ui);font-size:12px;font-weight:500;color:#6b6676}
.preview .pv-act{text-align:start}
.preview .pv-dlg{text-align:center}
.preview .pv-dlg i{display:block;font-style:normal;font-weight:700;font-size:14px}
.radio{display:flex;flex-direction:column;gap:6px}
.radio label{display:flex;gap:8px;align-items:flex-start;font-size:15px;color:var(--ink);cursor:pointer}
.radio input{margin-top:5px;accent-color:var(--ink)}
.scenebox{display:flex;flex-direction:column;gap:10px;padding-inline-start:26px}
.slugpv{font-family:var(--script);font-weight:700;font-size:18px;background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:8px 12px}
.beat-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.beat-head .num{font-size:13px;color:var(--muted);min-width:22px}
.beat-head select{width:auto;padding:6px 10px}
.beat-head .sp{flex:1}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:8px;width:34px;height:34px;display:grid;place-items:center;font-size:15px}
.tokens{display:flex;flex-wrap:wrap;gap:6px}
.tok{border:1px dashed var(--muted);background:var(--surface);border-radius:8px;padding:4px 9px;font-size:13px}
.tok code{font-family:inherit;font-weight:700}
.help{font-size:13.5px;color:var(--muted);line-height:1.6}
.help code{background:var(--field);border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--ink)}
.codebox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;word-break:break-all;background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:140px;overflow:auto;user-select:all;direction:ltr;text-align:left}
.mylist{display:flex;flex-direction:column;gap:8px}
.myitem{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--field);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.myitem b{font-size:16px}
.myitem span{font-size:13px;color:var(--muted)}
.empty{border:1.5px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--muted);font-size:14px}
.err{color:var(--a);font-size:14px}
.gi{flex:none;width:24px;height:24px;vertical-align:-6px;background:#FFF6DC;border-radius:50%;padding:2px}
.copy{margin-top:18px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;color:var(--muted);text-align:center}
/* journey map */

function sceneFor(st, override){
  const tp = topic(), custom = isCustomScene(st);
  const base = custom ? {ie:st.scene.ie||'פנים', loc:st.scene.loc, time:st.scene.time||'יום'} : {ie:tp.ie, loc:tp.loc, time:tp.time};
  let place = custom ? base.loc : tp.place, to = custom ? 'ל'+stripH(base.loc) : tp.to, inn = custom ? 'ב'+stripH(base.loc) : tp.in;
  const sc = Object.assign({}, base, override||{});
  if(override && override.loc && override.loc.trim() && override.loc!==base.loc){ place=sc.loc; to='ל'+stripH(sc.loc); inn='ב'+stripH(sc.loc); }
  return {ie:sc.ie, loc:sc.loc, time:sc.time, slug:slugOf(sc), place, to, in:inn, obj:tp.obj, ev:tp.ev};
}
const scene = ()=>sceneFor(story(), S.scene);
const charName = (chars,i)=> (chars[i] && chars[i].name && chars[i].name.trim()) || ('דמות '+LETTERS[i]);

function fillCtx(s, chars, sc){
  return String(s||'').replace(/\{([^{}]+)\}/g,(m,k)=>{
    const i=k.indexOf(':');
    if(i>0){
      const who=k.slice(0,i).trim(), parts=k.slice(i+1).split('|');
      let fem=false;
      if(who==='אב') fem = chars[0]&&chars[0].g==='f' && chars[1]&&chars[1].g==='f';
      else if(who==='כולם') fem = chars.every(c=>c.g==='f');
      else { const n=LETTERS.indexOf(who); fem = n>=0 && chars[n] && chars[n].g==='f'; }
      return (fem && parts[1]!=null) ? parts[1] : parts[0];
    }
    const key=k.trim(), n=LETTERS.indexOf(key);
    if(n>=0) return charName(chars,n);
    switch(key){
      case 'מקום': return sc.place; case 'למקום': return sc.to; case 'במקום': return sc.in;
      case 'חפץ': return sc.obj; case 'אירוע': return sc.ev;
    }
    return m;
  });
}
const fill = s => fillCtx(s, S.chars, scene());
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const ci = t => KEYS.indexOf(t);
const isTalk = t => KEYS.includes(t);                  // a character speaks (not action, not a scene heading)                       // 'A' -> 0

function charsNeeded(st){
  let n=2;
  for(const b of (st?st.beats:[])){
    if(ci(b.t)>=0) n=Math.max(n, ci(b.t)+1);
    for(const o of b.o){ const re=/\{([אבגדהו])[:}]/g; let m; while((m=re.exec(o))) n=Math.max(n, LETTERS.indexOf(m[1])+1); }
  }
  return Math.min(n,6);
}
function newChar(){
  return {name:'', g: S.chars.length%2?'f':'m'};   // kids type the name themselves

function ensureChars(){ const need=charsNeeded(story()); while(S.chars.length<need) S.chars.push(newChar()); }

function startStory(id, startId){
  const raw=storyById(id); if(!raw) return;
  S.start = raw.starts ? (startId || raw.starts[0].id) : null;
  const st=withStart(raw, S.start);
  S.storyId=id; S.scene=null;
  S.lines = st.beats.map(b=>({t:b.t, opts:b.o.slice(), pick:0, custom:''}));
  S.title = S.keepTitle || st.title; S.done = false;
  const g=curGroup(); if(g && !S.authors) S.authors = g.team;
  ensureChars(); openLine=-1; save();
}

/* ================= share codes ================= */
const b64e = str => { const bytes=new TextEncoder().encode(str); let bin=''; bytes.forEach(b=>bin+=String.fromCharCode(b)); return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); };
const b64d = s => { s=s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; const bin=atob(s); return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0))); };
function encodeStory(st){
  const j={g:st.genre,t:st.title,d:st.desc,b:st.beats.map(b=>[b.t,b.o])};
  if(isCustomScene(st)) j.s=[st.scene.ie,st.scene.loc,st.scene.time];
  return 'TSR1.'+b64e(JSON.stringify(j));
}
function decodeStory(code){
  const c=String(code||'').trim().replace(/^.*#story=/,'').replace(/\s+/g,'');
  if(!c.startsWith('TSR1.')) throw new Error('bad');
  const j=JSON.parse(b64d(c.slice(5)));
  if(!j || !Array.isArray(j.b) || !j.b.length) throw new Error('bad');
  const st={id:'g-'+Math.random().toString(36).slice(2,9), genre:String(j.g||'סיפור'), title:String(j.t||'סיפור מהמורה'), desc:String(j.d||''),
    beats:j.b.map(x=>({t:(x[0]==='act'||x[0]==='sc'||KEYS.includes(x[0]))?x[0]:'act', o:(Array.isArray(x[1])?x[1]:[]).map(String).filter(Boolean)})).filter(b=>b.o.length)};
  if(Array.isArray(j.s)&&j.s[1]) st.scene={m:'custom', ie:String(j.s[0]||'פנים'), loc:String(j.s[1]), time:String(j.s[2]||'יום')};
  return st;
}
function receive(code){
  const st=decodeStory(code);
  const dup=got.find(g=>g.title===st.title && JSON.stringify(g.beats)===JSON.stringify(st.beats));
  if(dup) return dup;
  got.unshift(st); store(K.got, got); return st;
}

let toastT;
function toast(t){ const el=document.getElementById('toast'); el.textContent=t; el.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>el.hidden=true,2400); }
function copy(text, okMsg){
  const done=()=>toast(okMsg||'הועתק');
  try{ navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done)); }catch(e){ fallbackCopy(text,done); }
}
function fallbackCopy(text,done){
  const ta=document.createElement('textarea'); ta.value=text; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){} ta.remove(); ok?done():toast('לא הצלחתי להעתיק. סמנו את הטקסט והעתיקו ידנית.');
}
async function saveFile(name, text){
  try{
    if(window.claude && window.claude.use){
      const d = await window.claude.use('downloads');
      if(d){ await d.save({filename:name, data:text}); toast('הקובץ נשמר'); return; }
    }
  }catch(e){ if(e && e.code==='declined') return; }
  try{
    const u=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'})), a=document.createElement('a');
    a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000);
    toast('הקובץ נשמר');
  }catch(e){ toast('לא הצלחתי לשמור קובץ. השתמשו ב"העתק".'); }
}
function scriptText(){
  const out=[];
  out.push(S.title||'התסריט שלנו'); if(S.authors) out.push('כתבו: '+S.authors);
  { const g=curGroup(); if(g){ const w=[g.cls&&('כיתה '+g.cls), g.school].filter(Boolean).join(', '); if(w) out.push(w); } } out.push('', 'סצנה 1. '+scene().slug, '');
  let sn=1;
  for(const L of S.lines||[]){
    const t=lineText(L); if(!t) continue;
    if(L.t==='sc'){ sn++; out.push('', 'סצנה '+sn+'. '+t, ''); }
    else if(L.t==='act'){ out.push(t,''); }
    else { out.push('                    '+charName(S.chars,ci(L.t)), '          '+t, ''); }
  }
  out.push('סוף');
  return out.join('\n');
}

      toast('נמצאה גרסה '+m[1]+'. מעדכנים…');
      try{ const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if(reg) await reg.update(); }catch(e){}
      setTimeout(()=>location.reload(), 900);
    } else toast('יש לכם את הגרסה העדכנית ('+APP_VERSION+') ✓');
  }catch(e){ toast('לא הצלחתי לבדוק. נסו שוב בעוד רגע.'); }
}

    return `<li><button type="button" data-act="go" data-k="${k}" ${S.step===k?'aria-current="step"':''} class="${S.step>k?'done':''}" ${can?'':'disabled'}><b>${k}</b><span>${n}</span></button></li>`;}).join('')}</ol>`;

const fmtDate = t => { try{ return new Date(t).toLocaleDateString('he-IL',{day:'numeric',month:'numeric'}); }catch(e){ return ''; } };

// The journey map: the whole way from story to filming, so kids know auditions and filming are coming.
function journey(){
  const done=!!S.done, left=audLeft();
  const cur = !S.storyId ? 0 : !done ? Math.min(S.step,4)-1 : left>0 ? 5 : 6;
  const st = k => k<cur ? 'past' : k===cur ? 'now' : 'next';
  const node = (k,label,icon='') => `<li class="jn ${st(k)} ${icon?'star':''}" ${k===cur?'aria-current="step"':''}>${k<cur?'<b aria-hidden="true">✓</b>':''}${icon}<span>${label}</span></li>`;
  const arrow = '<li class="ja" aria-hidden="true">←</li>';
  const fork = `<li class="jfork ${st(4)}"><span class="jn ${st(4)}">שוטינג ליסט</span><span class="jn ${st(4)}">תסריט</span></li>`;
  return `<nav class="journey" aria-label="המסלול שלנו"><ol>
    ${node(0,'סיפור')}${arrow}${node(1,'מקום')}${arrow}${node(2,'דמויות')}${arrow}${node(3,'סיום תסריט')}${arrow}
    ${fork}${arrow}${node(5,'אודישן','🎭 ')}${arrow}${node(6,'צילום הסרט','🎬 ')}
  </ol></nav>`;
}

const CAM_ICON = `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="M16 10l6-3v10l-6-3z"/></svg>`;

/* ================= teacher text insertion ================= */
function insertTok(i, tok){
  const el=document.getElementById('b-'+i); if(!el) return;
  const pos = (document.activeElement===el ? el.selectionStart : caret[i]) ?? el.value.length;
  const end = (document.activeElement===el ? el.selectionEnd : pos) ?? pos;
  const before=el.value.slice(0,pos), after=el.value.slice(end);
  const pad = before && !/\s$/.test(before) && !/(^|\s)[ובלשהמכ]$/.test(before) ? ' ' : '';   // keep Hebrew prefixes glued: ו{ב}
  el.value = before + pad + tok + after;
  const p = before.length + pad.length + tok.length; caret[i]=p;
  T.editing.beats[i].o = el.value.split('\n');
  el.focus(); el.setSelectionRange(p,p);
  const pv=document.getElementById('pv-'+i); if(pv) pv.innerHTML=beatPreview(T.editing.beats[i]);
}

const AUD = {mode:'aud', who:0, idx:0, stream:null, facing:'user', rec:null, chunks:[], url:'', mime:'', ext:'webm', t0:0, timer:0, actor:'', blob:null};
const $id = id => document.getElementById(id);
const audLines = () => (S.lines||[]).map((L,i)=>({i, t:L.t, text:lineText(L)})).filter(x=>x.text && x.text.trim());
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);

function openAud(mode){
  const lines=audLines(); if(!lines.length){ toast('אין עדיין שורות בתסריט'); return; }
  AUD.mode = mode||'aud';
  if(AUD.mode==='aud' && audLeft()===0){ toast('נגמרו האודישנים. עכשיו אקשן!'); render(); return; }
  AUD.facing = AUD.mode==='scene' ? 'environment' : 'user';   // the scene is filmed by a friend, an audition by yourself
  const speakers=[...new Set(lines.filter(x=>isTalk(x.t)).map(x=>ci(x.t)))];
  if(!speakers.includes(AUD.who)) AUD.who = speakers[0] ?? 0;
  AUD.idx = 0;
  $id('aud').hidden=false; document.body.style.overflow='hidden';
  renderAudSide(); startAudCam();
}
function closeAud(){
  if(AUD.rec && AUD.rec.state==='recording'){ AUD.rec.onstop=null; AUD.rec.stop(); }
  clearInterval(AUD.timer); stopAudCam(); hideReview();
  $id('aud').hidden=true; document.body.style.overflow=''; render();
}
function camMsg(html){ const m=$id('audMsg'); m.innerHTML=html; m.hidden=!html; }
async function startAudCam(){
  stopAudCam(); camMsg('');
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ camMsg(noCamText()); return; }
  const v={facingMode:{ideal:AUD.facing}, width:{ideal:1280}, height:{ideal:720}};
  try{ AUD.stream = await navigator.mediaDevices.getUserMedia({video:v, audio:true}); }
  catch(e){ try{ AUD.stream = await navigator.mediaDevices.getUserMedia({video:v}); } catch(e2){ camMsg(noCamText(e2)); return; } }
  const vid=$id('audVid'); vid.srcObject=AUD.stream; vid.classList.toggle('mirror', AUD.facing==='user');
  vid.play().catch(()=>{});
}
function noCamText(err){
  if(!canLink) return '<b>המצלמה לא נפתחת בתצוגה של Claude.</b>זה יעבוד באפליקציה עצמה, בקישור של GitHub.<br>בינתיים אפשר לעשות חזרות עם התסריט שלמטה.';
  return '<b>אין גישה למצלמה.</b>אשרו גישה למצלמה ולמיקרופון בהגדרות הדפדפן, ונסו שוב.' + (err&&err.name?`<br><small>(${esc(err.name)})</small>`:'');
}
function stopAudCam(){ if(AUD.stream){ AUD.stream.getTracks().forEach(t=>t.stop()); AUD.stream=null; } const v=$id('audVid'); if(v) v.srcObject=null; }

function slateText(){
  if(AUD.mode==='scene'){ const n=1+audLines().slice(0,AUD.idx+1).filter(x=>x.t==='sc').length; return `<b>סצנה ${n}</b> · טייק ${(S.takes||0)+1}<br>${esc(S.title||'')}`; }
  const role=charName(S.chars,AUD.who);
  return `<b>אודישן</b> · ${esc(AUD.actor||'השחקן/ית')} בתפקיד <b>${esc(role)}</b><br>${esc(S.title||'')}`;
}
function renderAudSide(){
  const lines=audLines();
  const speakers=[...new Set(lines.filter(x=>isTalk(x.t)).map(x=>ci(x.t)))].sort((a,b)=>a-b);
  if(AUD.mode==='scene') $id('audHead').innerHTML = `<b style="font-size:17px">🎬 צילום הסצנה · טייק ${(S.takes||0)+1}</b>
    <span class="lbl">מישהו אחד מצלם, וכולם משחקים. התסריט כאן כדי להציץ בו בין טייקים.</span>`;
  else $id('audHead').innerHTML = `<span class="lbl">${audLeft()?`אודישן ${(S.auds||0)+1} מתוך ${audLimit()}`:'<b style="color:#FFC23D">סיימתם את כל האודישנים! סגרו ולחצו אקשן.</b>'}</span>
    <span class="lbl">על איזה תפקיד האודישן?</span>
    <div class="row">${speakers.map(k=>`<button type="button" class="rolechip" data-act="aud-who" data-k="${k}" aria-pressed="${AUD.who===k}">${esc(charName(S.chars,k))}</button>`).join('')}</div>
    <div class="row"><label class="lbl" for="audActor">מי משחק?</label><input type="text" id="audActor" value="${esc(AUD.actor)}" placeholder="שם השחקן/ית" maxlength="24"></div>`;
  let sn=1;
  $id('audTele').innerHTML = lines.map((x,n)=>{
    const mine = AUD.mode==='aud' && isTalk(x.t) && ci(x.t)===AUD.who;
    if(x.t==='sc'){ sn++; return `<button type="button" class="tl act sc ${n===AUD.idx?'cur':''}" data-act="aud-go" data-n="${n}"><i>סצנה ${sn}</i>${esc(x.text)}</button>`; }
    if(x.t==='act') return `<button type="button" class="tl act ${n===AUD.idx?'cur':''}" data-act="aud-go" data-n="${n}">${esc(x.text)}</button>`;
    return `<button type="button" class="tl ${mine?'mine':''} ${n===AUD.idx?'cur':''}" data-act="aud-go" data-n="${n}"><i>${esc(charName(S.chars,ci(x.t)))}</i>${esc(x.text)}</button>`;
  }).join('');
  $id('audSlate').innerHTML = slateText();
  const cur=$id('audTele').querySelector('.cur'); if(cur) cur.scrollIntoView({block:'center', behavior:'smooth'});
}
function audGo(n){ const L=audLines().length; AUD.idx=Math.max(0,Math.min(L-1,n)); renderAudSide(); }

function pickMime(){
  if(typeof MediaRecorder==='undefined') return null;
  for(const [m,ext] of [['video/mp4;codecs=avc1,mp4a','mp4'],['video/mp4','mp4'],['video/webm;codecs=vp9,opus','webm'],['video/webm;codecs=vp8,opus','webm'],['video/webm','webm']]){
    try{ if(MediaRecorder.isTypeSupported(m)) return {m,ext}; }catch(e){}
  }
  return {m:'',ext:'webm'};
}
function fmt(ms){ const s=Math.floor(ms/1000); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
async function toggleRec(){
  if(AUD.rec && AUD.rec.state==='recording'){ AUD.rec.stop(); return; }
  if(!AUD.stream){ toast(canLink?'המצלמה לא פעילה':'המצלמה עובדת רק באפליקציה עצמה'); return; }
  if(AUD.mode==='aud' && audLeft()===0){ toast('נגמרו האודישנים. סגרו ולחצו אקשן!'); return; }
  const mt=pickMime(); if(!mt){ toast('הדפדפן הזה לא יודע להקליט וידאו'); return; }
  const c=$id('audCount'); c.hidden=false;
  for(const n of [3,2,1]){ c.textContent=n; await new Promise(r=>setTimeout(r,800)); }
  if(AUD.mode==='scene'){ c.textContent='אקשן!'; await new Promise(r=>setTimeout(r,600)); }
  c.hidden=true;
  AUD.chunks=[]; AUD.mime=mt.m; AUD.ext=mt.ext;
  try{ AUD.rec = mt.m ? new MediaRecorder(AUD.stream,{mimeType:mt.m}) : new MediaRecorder(AUD.stream); }
  catch(e){ toast('לא הצלחתי להתחיל הקלטה'); return; }
  AUD.rec.ondataavailable = e=>{ if(e.data && e.data.size) AUD.chunks.push(e.data); };
  AUD.rec.onstop = ()=>{
    clearInterval(AUD.timer); $id('audRec').classList.remove('on'); $id('audTime').classList.remove('on');
    AUD.blob = new Blob(AUD.chunks, {type: AUD.rec.mimeType || AUD.mime || 'video/webm'});
    if(AUD.url) URL.revokeObjectURL(AUD.url);
    AUD.url = URL.createObjectURL(AUD.blob);
    const p=$id('audPlay'); p.src=AUD.url; $id('audReview').hidden=false;
    // a recording shorter than 3 seconds is a false start and does not count
    if(Date.now()-AUD.t0 >= 3000){
      if(AUD.mode==='scene'){ AUD.takeNo=(S.takes||0)+1; S.takes=AUD.takeNo; }
      else { S.auds=(S.auds||0)+1; if(!audLeft()) toast('זה היה האודישן האחרון. עכשיו אקשן!'); }
      save();
    }
    renderAudSide();
  };
  AUD.rec.start(500); AUD.t0=Date.now();
  $id('audRec').classList.add('on'); $id('audTime').classList.add('on');
  AUD.timer=setInterval(()=>{ $id('audTime').textContent=fmt(Date.now()-AUD.t0); },250);
}
function hideReview(){ const p=$id('audPlay'); if(p){ p.pause(); p.removeAttribute('src'); p.load(); } const r=$id('audReview'); if(r) r.hidden=true; $id('audTime').textContent='00:00'; }
function saveTake(){
  if(!AUD.blob) return;
  const d=new Date(), pad=n=>String(n).padStart(2,'0');
  const kind = AUD.mode==='scene' ? `scene1-take${AUD.takeNo||1}` : 'audition';
  const name=`${kind}-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.${AUD.ext}`; // ASCII: some browsers drop Hebrew download names
  const file=new File([AUD.blob], name, {type:AUD.blob.type||'video/'+AUD.ext});
  if(IS_IOS && navigator.canShare && navigator.canShare({files:[file]})){ navigator.share({files:[file]}).catch(()=>{}); return; }
  const a=document.createElement('a'); a.href=AUD.url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  toast('הסרטון נשמר בטלפון');
}

document.addEventListener('click', e=>{
  const b=e.target.closest('[data-act^="aud"]'); if(!b) return;
  const a=b.dataset.act;
  if(a==='aud-open') openAud('aud');
  else if(a==='aud-scene') openAud('scene');
  else if(a==='aud-close') closeAud();
  else if(a==='aud-flip'){ AUD.facing = AUD.facing==='user'?'environment':'user'; startAudCam(); }
  else if(a==='aud-rec') toggleRec();
  else if(a==='aud-save') saveTake();
  else if(a==='aud-retake') hideReview();
  else if(a==='aud-who'){ AUD.who=+b.dataset.k; const lines=audLines(); const n=lines.findIndex(x=>ci(x.t)===AUD.who); AUD.idx=Math.max(0,n); renderAudSide(); }
  else if(a==='aud-next') audGo(AUD.idx+1);
  else if(a==='aud-prev') audGo(AUD.idx-1);
  else if(a==='aud-go') audGo(+b.dataset.n);
});
document.addEventListener('input', e=>{ if(e.target.id==='audActor'){ AUD.actor=e.target.value; $id('audSlate').innerHTML=slateText(); } });
document.addEventListener('keydown', e=>{ if($id('aud').hidden || e.target.tagName==='INPUT') return;
  if(e.key==='ArrowLeft'||e.key===' '){ e.preventDefault(); audGo(AUD.idx+1); } else if(e.key==='ArrowRight'){ audGo(AUD.idx-1); } else if(e.key==='Escape') closeAud(); });

/* ================= boot ================= */
function bootFromHash(){
  const h=location.hash||'';
  if(h.startsWith('#story=')){
    try{ const st=receive(h); if(curGroup()){ view='kid'; startStory(st.id); S.step=2; save(); } toast('קיבלתם סיפור מהמורה: '+st.title); }
    catch(e){ toast('הקישור לסיפור לא תקין'); }
    try{ history.replaceState(null,'',location.pathname); }catch(e){}
  }
}
if(S.storyId && !storyById(S.storyId)){ S.storyId=null; S.step=1; S.lines=null; }
bootFromHash();
render();
addEventListener('hashchange', ()=>{ bootFromHash(); render(); });
})();
</script>

if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
  addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
